name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          rm cmdline.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "y" | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Install SDK Platforms
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameSpace-APK
          path: app/build/outputs/apk/debug/*.apk
